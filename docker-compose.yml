services:
  mysql:
    image: mysql:8.0
    container_name: apextech-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: apextech_ecommerce
      MYSQL_USER: apexuser
      MYSQL_PASSWORD: apexpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

volumes:
  mysql_data:
